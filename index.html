<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANISH · MSME Credit Desk — powered by finequs</title>
<style>
:root{--g:#1B5E4B;--g9:#0E3B2E;--g7:#2E8A6E;--amber:#B97E00;--ambersoft:#FFF3D9;--red:#C0392B;--redsoft:#FBE9E7;
--paper:#F5F7F6;--card:#fff;--ink:#1A2B26;--muted:#5F7268;--line:#DFE7E3;--ok:#177245;--oksoft:#E4F3EB;
--navy:#22376D;--fq-red:#EB2127;--fq-green:#11B04B;--sh:0 1px 2px rgba(14,59,46,.06),0 8px 22px rgba(14,59,46,.08)}
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
.mono{font-family:ui-monospace,Consolas,monospace}
#top{background:var(--g9);color:#fff;padding:10px 26px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:30}
#top .brand{font-weight:800;font-size:18px;letter-spacing:.04em}
#top .brand small{display:block;font-size:10px;font-weight:600;color:#9FC3B5;letter-spacing:.08em}
#top nav{display:flex;gap:4px;margin-left:22px}
#top nav a{color:#BDD6CB;text-decoration:none;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600}
#top nav a.on{background:rgba(255,255,255,.14);color:#fff}
.fq{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:10px;color:#9FC3B5;letter-spacing:.05em}
.fq svg{display:block}
#view{max-width:1180px;margin:0 auto;padding:24px 26px 70px}
.h1{font-size:21px;font-weight:800;color:var(--g9);margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.h2{font-weight:700;font-size:14.5px;color:var(--g9);margin:20px 0 9px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 17px;box-shadow:var(--sh);margin-bottom:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;box-shadow:var(--sh)}
.kpi .v{font-size:21px;font-weight:800;color:var(--g9)}
.kpi .l{font-size:10.5px;color:var(--muted);margin-top:3px}
table.t{width:100%;border-collapse:collapse;font-size:12.6px;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
.t th{background:var(--g);color:#fff;text-align:left;padding:7px 11px;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.t td{padding:7px 11px;border-top:1px solid var(--line);vertical-align:middle}
.t tr:nth-child(even) td{background:#FAFCFB}
.pill{display:inline-block;font-size:10px;padding:2px 8px;border-radius:14px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--oksoft);color:var(--ok)}.pill.warn{background:var(--ambersoft);color:var(--amber)}
.pill.bad{background:var(--redsoft);color:var(--red)}.pill.mut{background:#EDF2EF;color:var(--muted)}
.pill.blue{background:#E8F0FE;color:#1D4FA8}
.btn{display:inline-block;background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
.btn.amber{background:var(--amber)}.btn.red{background:var(--red)}
.btn.ghost{background:#fff;color:var(--g);border:1px solid var(--line)}
.btn.sm{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ic{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 8px;font-size:13px}
.ic:hover{border-color:var(--g)}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid #C7D4CD;border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
@media(max-width:860px){.grid3,.grid2{grid-template-columns:1fr}}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:12px 0;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 13px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit}
.tabs button.on{color:var(--g9);border-bottom-color:var(--amber)}
.chip{display:inline-block;background:#EDF2EF;border:1px solid var(--line);border-radius:14px;padding:2px 9px;font-size:11px;margin:2px 3px 2px 0}
.chip.f{background:#E8F0FE;border-color:#C6D8F7}
.chip.d{background:var(--ambersoft);border-color:#EDD9A3}
.chip.c{background:var(--oksoft);border-color:#BFE3CE}
.note{border-left:4px solid var(--g);background:#EFF5F2;border-radius:0 10px 10px 0;padding:9px 13px;margin:11px 0;font-size:12.5px}
.note.warn{border-left-color:var(--amber);background:var(--ambersoft)}
.note.bad{border-left-color:var(--red);background:var(--redsoft)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--g9);color:#fff;padding:10px 16px;border-radius:9px;font-size:13px;box-shadow:var(--sh);z-index:99}
.modal-bg{position:fixed;inset:0;background:rgba(14,59,46,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.modal{background:#fff;border-radius:14px;padding:20px 22px;max-width:760px;width:100%;max-height:90vh;overflow-y:auto}
.parse-row{display:flex;justify-content:space-between;align-items:center;font-size:12.3px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-top:7px;background:#fff}
/* report */
#rep-bg{position:fixed;inset:0;background:rgba(14,59,46,.55);z-index:70;overflow-y:auto;padding:20px}
.report{background:#fff;max-width:820px;margin:0 auto;border-radius:6px;padding:34px 40px;font-size:13px}
.report h1{font-size:19px;color:var(--g9);margin:0}
.rep-head{display:flex;justify-content:space-between;border-bottom:3px solid var(--g);padding-bottom:10px;margin-bottom:16px}
.rep-head .rb{text-align:right;font-size:10.5px;color:var(--muted)}
.report h2{font-size:13px;color:#fff;background:var(--g);padding:5px 10px;border-radius:5px;margin:18px 0 8px}
.report table{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.report td,.report th{border:1px solid #D8E2DC;padding:5px 8px;text-align:left}
.report th{background:#EFF5F2;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.rep-actions{max-width:820px;margin:0 auto 12px;display:flex;gap:9px;justify-content:flex-end}
.disclaimer{font-size:9.5px;color:#8AA096;margin-top:16px;border-top:1px solid var(--line);padding-top:8px}
/* customer portal */
#portal{max-width:520px;margin:0 auto;padding:20px 16px 60px}
.p-head{background:var(--g9);color:#fff;border-radius:13px;padding:16px 18px;margin-bottom:14px}
.p-doc{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:8px;box-shadow:var(--sh)}

.hero{background:linear-gradient(140deg,var(--g9),var(--g) 60%,#2E8A6E);border-radius:15px;color:#fff;padding:20px 24px;margin-bottom:14px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:var(--sh)}
.hero h1{font-size:20px;margin:0;font-weight:800}
.hero p{margin:5px 0 0;color:#CFE5DB;font-size:12.5px;max-width:560px}
.hero .big{text-align:right}.hero .big b{font-size:26px;display:block}.hero .big span{font-size:10.5px;color:#CFE5DB}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.chart{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px;box-shadow:var(--sh)}
.chart b{font-size:12.5px;color:var(--g9)}
.funnel .fr{display:flex;align-items:center;gap:8px;margin-top:8px}
.funnel .fr span{width:118px;font-size:11px;color:var(--muted)}
.funnel .fr i{display:block;height:20px;border-radius:5px;background:linear-gradient(90deg,var(--g),#2E8A6E);min-width:22px}
.funnel .fr em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--g9)}
.donut{display:flex;gap:14px;align-items:center;margin-top:10px}
.donut .ring{width:110px;height:110px;border-radius:50%;position:relative;flex:none}
.donut .ring::after{content:"";position:absolute;inset:22px;background:#fff;border-radius:50%}
.donut .lg div{font-size:11px;margin:3px 0;display:flex;align-items:center;gap:6px}
.donut .sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.vbars{display:flex;gap:9px;align-items:flex-end;height:110px;margin-top:12px}
.vb{flex:1;text-align:center}
.vb i{display:block;background:var(--amber);border-radius:5px 5px 0 0;margin:0 auto;width:70%}
.vb small{font-size:9px;color:var(--muted);display:block;margin-top:4px;line-height:1.15}
.vb em{font-style:normal;font-size:11px;font-weight:800;color:var(--g9)}
.hbar .r{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px}
.hbar .r span{width:140px;color:var(--muted)}
.hbar .r i{display:block;height:12px;border-radius:4px;background:var(--g7)}
.spark{display:flex;gap:4px;align-items:flex-end;height:46px;margin-top:10px}
.spark i{flex:1;background:#BFE3CE;border-radius:3px 3px 0 0}
.spark i.hot{background:var(--g)}
.docview{background:#fff;border:1px solid #C9D6CF;border-radius:6px;padding:18px 22px;font-size:12px;max-height:56vh;overflow-y:auto}
.dv-head{border-bottom:2px solid var(--g9);padding-bottom:8px;margin-bottom:10px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.dv-head b{color:var(--g9);font-size:13px}
.dv-stamp{border:2px solid var(--g);color:var(--g);border-radius:6px;padding:2px 8px;font-size:9px;font-weight:800;transform:rotate(-4deg)}
.docview table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0}
.docview td,.docview th{border:1px solid #DDE6E0;padding:4px 7px;text-align:left}
.docview th{background:#EFF5F2}
@media print{
  body *{visibility:hidden} #rep-bg,#rep-bg *{visibility:visible}
  #rep-bg{position:absolute;inset:auto;left:0;top:0;width:100%;background:#fff;padding:0}
  .rep-actions{display:none} .report{box-shadow:none;border-radius:0;max-width:100%}
}
</style>

<script>
/* ================= DATA ================= */
const KEY='anish-desk-v2';
const PSTAT=['New','No Answer','Call Back','Not Interested'];
const CSTAT=['Interested','Docs Requested','Docs Received','Parsed','Assessment Ready','Submitted to Bank','Sanctioned','Disbursed','Declined'];
const isCust=p=>CSTAT.includes(p.status);
const seedDocs=[
 {id:'d1',name:'IT Return + P&L + B/S (with 3CB/3CD) — last year',cat:'Financials',fields:['turnover','pat','depreciation','interest_paid','current_assets','current_liabilities','tol','tnw','term_debt'],derived:['CR = current_assets / current_liabilities','TOL/TNW = tol / tnw','DER = term_debt / tnw','Turnover trend (3-yr)'],checks:['ITR turnover vs GST sales (±10%)']},
 {id:'d2',name:'Provisional B/S 26-27',cat:'Financials',fields:['prov_turnover','prov_networth','prov_current_ratio'],derived:[],checks:[]},
 {id:'d3',name:'Company KYC — GST · MSME/Udyam · PAN',cat:'KYC',fields:['gstin','udyam_no','company_pan','constitution'],derived:[],checks:['GSTIN active status']},
 {id:'d4',name:'Individual KYC — Aadhaar · PAN · IT (3 yrs)',cat:'KYC',fields:['partner_name','pan','aadhaar_last4','itr_income_y1','itr_income_y2','itr_income_y3'],derived:[],checks:[]},
 {id:'d5',name:'Company Profile',cat:'Profile',fields:['line_of_business','years_in_business','major_customers'],derived:[],checks:[]},
 {id:'d6',name:'GSTR-3B — Apr 2025 to Jun 2026',cat:'GST',fields:['gst_sales_12m','gst_monthly_avg','filing_delays'],derived:[],checks:['GST sales vs bank credits (±10%)']},
 {id:'d7',name:'Loan sanction letters + existing loans (excel)',cat:'Borrowings',fields:['lender','facility_type','sanctioned_limit','outstanding','roi','emi'],derived:['Total EMI obligation','Blended ROI'],checks:['Sanction letters vs CIBIL accounts']},
 {id:'d8',name:'Bank statements — Apr 2025 to date',cat:'Banking',fields:['total_credits_12m','avg_monthly_balance','cheque_bounces','od_avg_utilisation','churn_ratio'],derived:['Banking churn = credits / turnover','DSCR = (PAT+Dep+Int)/(Int+Repayments)'],checks:['Bank credits vs GST sales (±10%)','Bounce count ≤ 2']},
 {id:'d9',name:'Commercial CIBIL report (PDF)',cat:'Bureau',fields:['cmr_rank','commercial_score','overdue_accounts','writeoff_flag'],derived:[],checks:['No NPA / OTS / write-off flags']},
 {id:'d10',name:'Individual CIBIL report (PDF)',cat:'Bureau',fields:['cibil_score','dpd_history','enquiries_6m'],derived:[],checks:['Score ≥ 700','No 30+ DPD in 12m']},
];
const IND=['Freight Forwarding','Finished Leather Trading','Logistics & Warehousing','Auto Components','Textiles & Garments','Food Processing','Pharma Distribution','Packaging'];
const CITIES=['Chennai','Ambur','Ranipet','Coimbatore','Tiruppur','Madurai','Vellore','Hosur'];
function seedProspects(){
  const names=['Meridian Freight Lines','Coromandel Cargo Movers','Vanigam Logistics','Pearl City Forwarders','Arcot Leather Exports','Thangam Freight Systems','BlueAnchor Shipping Services','Kaveri Container Lines','Marina Trade Logistics','Sunrise Leather Co','Velocity Supply Chain','Deccan Freight Bridge','Palar Exports','GreenLine Movers','Chettinad Cargo Care','Eastern Gate Forwarders','Nellai Logistics Hub','Harbour Point Shipping','Krisha Freight Solutions','TransCauvery Logistics','Ambattur Auto Links','Weavers Yarn Traders','AgroFresh Processors','MedServe Distributors','PackRight Industries','Southern Star Freight','Lighthouse Forwarding Co','Anna Nagar Trade Lines'];
  return names.map((n,i)=>({id:'P'+(101+i),company:n,contact:['Suresh','Priya','Ibrahim','Lakshmi','Vignesh','Fathima','Karthik','Meena'][i%8]+' '+['R','S','K','M'][i%4],
    mobile:'98'+String(41000000+i*13579).slice(0,8),email:n.toLowerCase().replace(/[^a-z]/g,'').slice(0,10)+'@gmail.com',
    city:CITIES[i%8],address:(12+i)+', '+['Harbour Rd','GST Rd','Mount Rd','SIPCOT Estate'][i%4]+', '+CITIES[i%8],
    industry:IND[i%8],turnover_band:['₹1–5 Cr','₹5–10 Cr','₹10–25 Cr'][i%3],
    status: i===0?'Parsed': i===1?'Disbursed': i===2?'Interested': i===3?'Docs Requested': i<6?'Call Back': i<9?'No Answer': i<11?'Not Interested':'New',
    notes:'', dataEntry:null, docsSel:null, docsRecv:{}, parsed:null, linkToken:null, disb:null, disbDocs:{}}));
}
function mockParsed(){
  return JSON.parse(JSON.stringify({
   d1:{turnover:'2,054',pat:'92.4',depreciation:'6.4',interest_paid:'21.0',current_assets:'612',current_liabilities:'431',tol:'745',tnw:'356',term_debt:'118',_hist:'1,450 → 1,720 → 2,054'},
   d3:{gstin:'33AAXFM12XXXXZ5 · Active',udyam_no:'UDYAM-TN-02-04XXXXX',company_pan:'AAXFM12XXX',constitution:'Partnership'},
   d6:{gst_sales_12m:'1,986',gst_monthly_avg:'165.5',filing_delays:'1 (Nov-25, 4 days)'},
   d7:{lender:'2 lenders',facility_type:'TL + OD',sanctioned_limit:'118',outstanding:'96',roi:'14.5% / 11.8%',emi:'2.84/mo'},
   d8:{total_credits_12m:'1,913',avg_monthly_balance:'38.2',cheque_bounces:'2 (inward, technical)',od_avg_utilisation:'81%',churn_ratio:'0.93'},
   d9:{cmr_rank:'CMR-4',commercial_score:'728',overdue_accounts:'0',writeoff_flag:'None'},
   d10:{cibil_score:'741',dpd_history:'Nil 30+ in 24m',enquiries_6m:'3'}}));
}
function seedCase(p){
  p.dataEntry={constitution:'Partnership',partners:'Rahim Basha · Selvam N · Joseph A',doi:'12.06.2016',udyam:'UDYAM-TN-02-04XXXXX',pan:'AAXFM12XXX',gstin:'33AAXFM12XXXXZ5',address:p.address,business:'Freight forwarding & finished leather trading',bank:'Axis Bank — CA',existing:'NBFC TL ₹68L · OD ₹50L',facility:'Cash Credit',amount:'₹250 L'};
  p.docsSel=['d1','d3','d6','d7','d8','d9','d10'];
  p.docsRecv={d1:'recv',d3:'recv',d6:'recv',d7:'recv',d8:'recv',d9:'recv',d10:'recv'};
  p.parsed=mockParsed();
  p.status='Parsed';
  return p;
}
function seedDisb(p){
  seedCase(p); p.status='Disbursed';
  p.dataEntry.amount='₹120 L'; p.dataEntry.facility='Term Loan + OD';
  p.disb={lender:'Dhanalakshmi Capital Finance',facility:'OD + TL',sanctioned:'120',disbursed:'120',date:'2026-06-18',roi:'12.25%',tenure:'60',emi:'2.14',pf:'1.00%',utr:'UTR26DFC48213',payout:'1.68',remarks:'OD renewable annually; TL for warehouse racking'};
  p.disbDocs={sanction:'stored',disbursement:'stored',schedule:'stored'};
  return p;
}
function loadDB(){
  try{ const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.prospects) return d; }catch(e){}
  const prospects=seedProspects(); seedCase(prospects[0]); seedDisb(prospects[1]);
  prospects[3].dataEntry={constitution:'Proprietorship',partners:'Lakshmi M',doi:'03.04.2019',udyam:'UDYAM-TN-11-01XXXXX',pan:'AKXPL44XXX',gstin:'33AKXPL44XXXXZ2',address:prospects[3].address,business:prospects[3].industry,bank:'City Union Bank — CA',existing:'None',facility:'Cash Credit',amount:'₹80 L'};
  prospects[3].docsSel=['d1','d3','d6','d8']; prospects[3].linkToken='104DEMO';
  const db={prospects,docs:JSON.parse(JSON.stringify(seedDocs))};
  localStorage.setItem(KEY,JSON.stringify(db)); return db;
}
let DB=loadDB();
const save=()=>localStorage.setItem(KEY,JSON.stringify(DB));
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);};
const pill=(t,c)=>`<span class="pill ${c}">${esc(t)}</span>`;
const stPill=s=>pill(s, s==='Interested'||s==='Parsed'||s==='Assessment Ready'?'ok': s==='Not Interested'?'bad': s==='New'?'mut': s==='Docs Requested'||s==='Docs Received'?'blue':'warn');

/* ================= ROUTER ================= */
const routes={};
function route(h,f){routes[h]=f;}
function go(h){location.hash=h;}
window.addEventListener('hashchange',render);
function render(){
  const h=location.hash||'#/dash';
  const base=h.split('@')[0], arg=h.split('@')[1];
  document.querySelectorAll('[data-n]').forEach(a=>a.classList.toggle('on',a.dataset.n===base));
  if(base==='#/portal'){ $('#view').style.display='none'; document.getElementById('top').style.display='none'; $('#portal').style.display='block'; routes[base](arg); return; }
  $('#view').style.display='block'; document.getElementById('top').style.display='flex'; $('#portal').style.display='none';
  (routes[base]||routes['#/dash'])(arg);
}

/* ================= DASHBOARD ================= */
route('#/dash',()=>{
  const A=DB.prospects;
  const pr=A.filter(p=>!isCust(p)), cu=A.filter(p=>isCust(p)&&p.status!=='Disbursed'&&p.status!=='Declined'), di=A.filter(p=>p.status==='Disbursed');
  const c=(arr,s)=>arr.filter(p=>p.status===s).length;
  const disbAmt=di.reduce((a,p)=>a+(+((p.disb||{}).disbursed||0)),0);
  const payout=di.reduce((a,p)=>a+(+((p.disb||{}).payout||0)),0);
  const funnel=[['Prospects',A.length],['Interested+',cu.length+di.length],['Docs stage',c(A,'Docs Requested')+c(A,'Docs Received')],['Parsed / Assessed',c(A,'Parsed')+c(A,'Assessment Ready')],['Disbursed',di.length]];
  const fmax=Math.max(...funnel.map(f=>f[1]))||1;
  const donutData=[['New',c(pr,'New'),'#1B5E4B'],['Call Back',c(pr,'Call Back'),'#B97E00'],['No Answer',c(pr,'No Answer'),'#7FA695'],['Not Interested',c(pr,'Not Interested'),'#C0392B']];
  const dtot=donutData.reduce((a,x)=>a+x[1],0)||1; let acc=0;

route('#/prospects',()=>{
  const f=window._pf||{status:'',q:''};
  const P=DB.prospects.filter(p=>!isCust(p)&&(!f.status||p.status===f.status)&&(!f.q||JSON.stringify(p).toLowerCase().includes(f.q.toLowerCase())));
  $('#view').innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px">
    <div><h1 class="h1">Prospects</h1><p class="sub">${P.length} in calling queue · mark <b>Interested</b> to move a lead to Customers</p></div>
    <span><button class="btn ghost" id="tmpl">⬇ CSV template</button> <button class="btn" id="up">+ Upload prospect list</button></span>
  </div>
  <input type="file" id="upfile" accept=".csv" style="display:none">
  <div class="card" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <select id="f-status" style="border:1px solid #C7D4CD;border-radius:8px;padding:7px 10px;font-family:inherit">
      <option value="">All statuses</option>${PSTAT.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select>
    <input id="f-q" placeholder="Search company / city / industry…" value="${esc(f.q)}" style="flex:1;min-width:220px;border:1px solid #C7D4CD;border-radius:8px;padding:7px 10px;font-family:inherit">
  </div>
  <table class="t"><tr><th>Company</th><th>Contact</th><th>City</th><th>Industry</th><th>Status</th><th style="width:250px">Actions</th></tr>
  ${P.map(p=>`<tr>
    <td><b>${esc(p.company)}</b><br><span class="mono" style="font-size:10px;color:var(--muted)">${p.id} · ${esc(p.turnover_band)}</span></td>
    <td>${esc(p.contact)}<br><span class="mono" style="font-size:10.5px">${esc(p.mobile)}</span></td>
    <td>${esc(p.city)}</td><td style="font-size:12px">${esc(p.industry)}</td>
    <td><select data-st="${p.id}" style="border:1px solid #C7D4CD;border-radius:7px;padding:4px 6px;font-size:11.5px;font-family:inherit">
      ${[...PSTAT,'Interested → Customers'].map(s=>`<option value="${s.split(' ')[0]}" ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><button class="ic" data-brief="${p.id}" title="AI Prospect Brief">🧠 Brief</button></td></tr>`).join('')}
  </table>`;
  $('#f-status').onchange=e=>{window._pf={...f,status:e.target.value};render();};
  $('#f-q').oninput=e=>{window._pf={...f,q:e.target.value};clearTimeout(window._pt);window._pt=setTimeout(render,350);};
  document.querySelectorAll('select[data-st]').forEach(s=>s.onchange=()=>{
    const p=DB.prospects.find(x=>x.id===s.dataset.st); p.status=s.value; save();
    if(s.value==='Interested'){ toast(p.company+' moved to Customers — open the Loan File to enter data'); }
    else toast(p.company+' → '+s.value);
    render();});
  document.querySelectorAll('[data-brief]').forEach(b=>b.onclick=()=>genBrief(b.dataset.brief));
  $('#up').onclick=()=>$('#upfile').click();
  $('#tmpl').onclick=()=>{
    const csv='company,contact,mobile,email,city,address,industry,turnover_band\nSample Traders,Ravi K,9841000000,ravi@sample.com,Chennai,"12 GST Rd, Chennai",Logistics,₹1–5 Cr';
    const a=document.createElement('a');a.href='data:text/csv,'+encodeURIComponent(csv);a.download='prospect_template.csv';a.click();};
  $('#upfile').addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const lines=String(rd.result).trim().split(/[\r\n]+/); const hdr=lines[0].split(',').map(h=>h.trim().toLowerCase());
      let n=0;
      for(const ln of lines.slice(1)){
        const cells=ln.match(/("[^"]*"|[^,]+)/g)||[]; if(cells.length<2) continue;
        const row={}; hdr.forEach((h,i)=>row[h]=(cells[i]||'').replace(/^"|"$/g,'').trim());
        if(!row.company) continue;
        DB.prospects.push({id:'P'+(100+DB.prospects.length+1),company:row.company,contact:row.contact||'—',mobile:row.mobile||'—',email:row.email||'—',city:row.city||'—',address:row.address||'—',industry:row.industry||'—',turnover_band:row.turnover_band||'—',status:'New',notes:'',dataEntry:null,docsSel:null,docsRecv:{},parsed:null,linkToken:null}); n++;
      }
      save(); toast(n+' prospects imported to queue'); render();
    };
    rd.readAsText(file);
  });
});

/* ================= AI PROSPECT BRIEF ================= */
function genBrief(id){
  const p=DB.prospects.find(x=>x.id===id);
  showReport(`<div style="text-align:center;padding:50px 0"><b>CreditIQ AI is preparing the brief…</b><div class="sub" style="margin-top:8px">Reading prospect record · industry signals · positioning</div></div>`);
  setTimeout(()=>{
    const freight=/freight|logistic|cargo|shipping|forward/i.test(p.industry+p.company);
    showReport(repShell('AI PROSPECT BRIEF — PRE-CALL',`
      <h2>1 · Who they are</h2>
      <table><tr><th style="width:32%">Company</th><td><b>${esc(p.company)}</b> (${esc(p.id)})</td></tr>
      <tr><th>Contact</th><td>${esc(p.contact)} · ${esc(p.mobile)} · ${esc(p.email)}</td></tr>
      <tr><th>Location</th><td>${esc(p.address)}</td></tr>
      <tr><th>Industry</th><td>${esc(p.industry)} · indicative turnover ${esc(p.turnover_band)}</td></tr></table>
      <h2>2 · What the business likely looks like</h2>
      <p>${freight?
        `${esc(p.industry)} in ${esc(p.city)} typically runs on 60–120 day receivable cycles against shipping lines and exporters, with thin fixed assets and working capital as the binding constraint. Firms of this size are frequently unbanked on limits — funding growth from accruals and informal credit.`:
        `${esc(p.industry)} units in ${esc(p.city)} at ${esc(p.turnover_band)} scale typically carry inventory + receivable cycles of 90–150 days; working-capital adequacy and formal banking limits are the usual gaps.`}
      </p>
      <h2>3 · Credit appetite signals</h2>
      <table><tr><th>Signal</th><th>Reading</th></tr>
      <tr><td>Scale band</td><td>${esc(p.turnover_band)} — inside CC/OD sweet spot for SFBs & mid-tier NBFCs</td></tr>
      <tr><td>Sector</td><td>${freight?'Logistics/forwarding — receivable-backed CC and bill discounting fit well':'Working-capital products and machinery term loans are the usual fits'}</td></tr>
      <tr><td>Data available</td><td>Only list fields — no financials on record yet; treat the below as hypotheses to verify on the call</td></tr></table>
      <h2>4 · Positioning for the call</h2>
      <p><b>Open with:</b> "We arrange bank working-capital limits for ${esc(p.industry.toLowerCase())} firms in ${esc(p.city)} — most of your peers run on delayed payments; a CC limit against your receivables usually releases 2–3 months of cash."</p>
      <p><b>Products to position:</b> Cash Credit / OD against book debts · Bill discounting · GST-based unsecured WC (if limits shy).</p>
      <h2>5 · Five questions for the call</h2>
      <table>
      <tr><td>1</td><td>Current banker and any existing limits — CC/OD/TL, and utilisation?</td></tr>
      <tr><td>2</td><td>Monthly billing and who the top 3 customers are — payment terms?</td></tr>
      <tr><td>3</td><td>Last year's turnover and this year's run-rate?</td></tr>
      <tr><td>4</td><td>Any cheque returns / delayed EMIs in the last 12 months?</td></tr>
      <tr><td>5</td><td>GST filings current? Audited financials ready for FY24-25?</td></tr></table>
      <div class="note warn" style="margin-top:14px"><b>Caution:</b> This brief is generated from the uploaded prospect fields plus industry patterns; nothing here is verified. Where the record is silent, the AI has said so rather than invented specifics.</div>
    `, p.company));
  }, 1400);
}

  <p><b>Proceed to bank submission.</b> Position as ${esc(D.facility)} of ${esc(D.amount)} against hypothecation of book debts (receivable cover ~3.0 months), with drawing-power workings and banker confirmation on the two returns. First approaches: SFBs and mid-tier private banks active in ${esc(p.city)} MSME lending.</p>
  `, p.company);
}
